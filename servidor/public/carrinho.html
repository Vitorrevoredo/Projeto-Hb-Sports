<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HB Sports - Meu Carrinho</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/carrinho.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
    </header>

    <main class="principal-pagina-carrinho">
        <div class="conteiner-carrinho">
            <div class="titulo-carrinho">
                <h1>Meu Carrinho</h1>
                <a href="calcados.html" class="botao-continuar-comprando">Continuar Comprando</a>
            </div>

            <div class="conteudo-carrinho">
                <div class="lista-itens-carrinho" id="lista-carrinho">
                </div>

                <aside class="resumo-carrinho" id="resumo-carrinho">
                    <h2>Resumo do Pedido</h2>
                    <div class="detalhe-resumo">
                        <span>Subtotal</span>
                        <span id="subtotal-valor">R$ 0,00</span>
                    </div>
                    <div class="detalhe-resumo">
                        <span>Frete</span>
                        <span>Grátis</span>
                    </div>
                    <div class="total-resumo">
                        <span>Total</span>
                        <span id="total-valor">R$ 0,00</span>
                    </div>
                    <button class="botao botao-finalizar-compra">Finalizar Compra</button>
                </aside>
            </div>
        </div>
    </main>

    <footer>
    </footer>

    <script src="js/carrinho-pagina.js" defer></script>
</body>

</html>
