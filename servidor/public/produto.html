<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/produto.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <header>
    </header>

    <main class="principal-pagina-produto">
        <div class="conteiner-produto">
            <div class="info-produto">
                <h1 id="nome-produto">Carregando...</h1>
                <p class="preco-produto" id="preco-produto">R$ 0,00</p>
                <div class="acoes-produto">
                    <button class="botao botao-primario">ADICIONAR AO CARRINHO</button>
                    <button class="botao botao-secundario">COMPRAR AGORA</button>
                </div>
            </div>

            <div class="galeria-produto">
                <div class="imagem-principal-container">
                    <button class="seta-galeria anterior"><i class="fas fa-chevron-left"></i></button>
                    <img src="assets/placeholder.png" alt="Imagem principal do produto" id="imagem-principal">
                    <button class="seta-galeria proximo"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="container-miniaturas" id="miniaturas">
                </div>
            </div>

            <div class="pontos-galeria" id="pontos-galeria">
            </div>
        </div>
    </main>
    <footer>
    </footer>

    <script src="js/carrinho.js" defer></script>
    <script src="js/produto.js" defer></script>
</body>

</html>
